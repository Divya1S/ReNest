# ReNest — Render Blueprint (https://render.com/docs/blueprint-spec)
#
# One-click deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# This blueprint is sized for Render's FREE tier so the app costs nothing to
# run: one free web service (Django API + built SPA, uvicorn/ASGI for SSE) plus
# a free Postgres database. Free-tier constraints that matter (see the
# "Deployment" section of README.md for the full picture):
#
#   * The web service spins down after 15 minutes without traffic; the first
#     request afterwards takes about a minute. The scheduled GitHub Actions
#     maintenance job (.github/workflows/maintenance.yml) wakes it up.
#   * Free instances cannot run background workers, so there is no Celery
#     worker or beat here. Tasks run inline (CELERY_TASK_ALWAYS_EAGER) and the
#     periodic jobs are triggered through /api/internal/maintenance/ by the
#     GitHub Actions cron. To move to real workers later, uncomment the
#     "Paid tier" services at the bottom and set REDIS_URL.
#   * Render's free Postgres expires 30 days after creation. For a database
#     that persists, use a free-forever provider (Neon or Supabase), set
#     DATABASE_URL on the web service, and delete the "databases" block.
#   * The free disk is ephemeral: set AWS_S3_BUCKET_NAME (+ endpoint for
#     Cloudflare R2's free tier) so uploaded photos survive redeploys.
#
# After the first deploy, fill in the sync:false secrets in the dashboard.

databases:
  - name: renest-db
    plan: free
    databaseName: renest
    user: renest

services:
  # ── Web: Django API + built SPA, served same-origin ──────────────────────────
  - type: web
    name: renest-web
    runtime: python
    plan: free
    buildCommand: ./scripts/render-build.sh
    # One worker on the free instance (512 MB). Raise WEB_CONCURRENCY on paid
    # plans; the start command reads it.
    startCommand: >
      cd backend && uvicorn dormcycle.asgi:application
      --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
      --timeout-keep-alive 65
    healthCheckPath: /api/health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: renest-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MAINTENANCE_TOKEN
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Render injects RENDER_EXTERNAL_HOSTNAME; settings.py trusts it
      # automatically, so these only need editing once you attach a custom
      # domain (add it to all four).
      - key: DJANGO_ALLOWED_HOSTS
        value: renest-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://renest-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://renest-web.onrender.com
      - key: APP_BASE_URL
        value: https://renest-web.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: WEB_CONCURRENCY
        value: "1"
      # ── Secrets: fill these in the dashboard after the blueprint creates them
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_CDN_DOMAIN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_SUB
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Frontend Sentry: read at build time by Vite. The CSP middleware widens
      # connect-src to this host so the browser SDK can actually report.
      - key: VITE_SENTRY_DSN
        sync: false
      # Payments (campus subscriptions, listing boosts). Both are required
      # together: without the webhook secret the endpoint refuses events.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional: set to an external Redis URL (e.g. Upstash free tier) to
      # enable shared caching and sessions across workers. Leave unset on the
      # free tier; Render's free Key Value store loses data on restart.
      - key: REDIS_URL
        sync: false

