name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ci.renest.test
  CORS_ALLOWED_ORIGINS: https://ci.renest.test
  DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.renest.test
  APP_BASE_URL: https://ci.renest.test
  USE_SQLITE: "1"

jobs:
  backend:
    name: Backend tests + types + evals
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests (SQLite)
        working-directory: backend
        run: python manage.py test --verbosity 2

      - name: Type check (mypy — whole backend)
        working-directory: backend
        run: mypy .

      - name: Concierge golden-set evals (offline)
        working-directory: backend
        env:
          # Deliberately unset: offline evals must pass without any AI key.
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: |
          python manage.py migrate --noinput
          python manage.py run_concierge_evals

  frontend:
    name: Frontend tests + lint + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings 0

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
