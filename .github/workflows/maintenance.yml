name: Maintenance

on:
  # Run every 30 minutes.
  schedule:
    - cron: "*/30 * * * *"
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

jobs:
  run_maintenance:
    name: run_maintenance
    runs-on: ubuntu-latest
    # Only run on the default branch so forks/PRs don't fire this.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run maintenance
        working-directory: backend
        env:
          # Production database — configure these in Settings → Secrets → Actions.
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Django production settings.
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DJANGO_CSRF_TRUSTED_ORIGINS: ${{ secrets.DJANGO_CSRF_TRUSTED_ORIGINS }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # Optional: forward maintenance logs to Sentry.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python manage.py run_maintenance
