name: Maintenance

# Zero-cost scheduler for the jobs Celery beat would normally run (listing
# expiry, handoff reminders, saved-search alerts, trending cache, weekly
# digests). Instead of connecting to the database from the runner, it calls the
# deployed app's token-protected maintenance endpoint, so the only things it
# needs are the public URL and the shared MAINTENANCE_TOKEN.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   secret  MAINTENANCE_TOKEN  same value as the MAINTENANCE_TOKEN env var on the server
#   variable MAINTENANCE_URL   e.g. https://renest-web.onrender.com
#
# Until both are configured the job exits early without failing.

on:
  schedule:
    # Every 30 minutes: expiry, reminders, saved-search alerts, trending, push queue.
    - cron: "*/30 * * * *"
    # Daily 03:15 UTC: demand forecast.
    - cron: "15 3 * * *"
    # Weekly Sunday 08:30 UTC: completion rates + campus digest.
    - cron: "30 8 * * 0"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Job set to run (tick, daily, weekly, or all)"
        required: false
        default: "tick"

permissions:
  contents: read

jobs:
  run_maintenance:
    name: Trigger maintenance endpoint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Call maintenance endpoint
        env:
          MAINTENANCE_URL: ${{ vars.MAINTENANCE_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOBS: ${{ github.event.inputs.jobs }}
        run: |
          set -euo pipefail
          if [ -z "${MAINTENANCE_URL}" ] || [ -z "${MAINTENANCE_TOKEN}" ]; then
            echo "::notice::MAINTENANCE_URL variable or MAINTENANCE_TOKEN secret not configured; skipping."
            exit 0
          fi

          case "${SCHEDULE}" in
            "*/30 * * * *") JOBS="tick" ;;
            "15 3 * * *")   JOBS="daily" ;;
            "30 8 * * 0")   JOBS="weekly" ;;
            *)              JOBS="${MANUAL_JOBS:-tick}" ;;
          esac
          echo "Running job set: ${JOBS}"

          # Free-tier hosts spin down when idle; allow a cold start and retry.
          curl --silent --show-error --fail \
            --retry 4 --retry-delay 20 --retry-all-errors \
            --max-time 240 \
            -X POST "${MAINTENANCE_URL%/}/api/internal/maintenance/" \
            -H "Authorization: Bearer ${MAINTENANCE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"jobs\": [\"${JOBS}\"]}" \
            | tee maintenance.json
          echo
          python3 -c "import json; d=json.load(open('maintenance.json')); print('ok:', d.get('ok'), '|', json.dumps(d.get('results'), indent=1))"
