<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ReNest — Campus Move-Out Rescue Marketplace</title>
    <meta name="description" content="ReNest turns dorm room photos into rescue-ready listings. Keep usable essentials out of the dumpster and within reach for the next student." />

    <!-- Theme color adapts to OS color scheme -->
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReNest — Campus Move-Out Rescue" />
    <meta property="og:description" content="Turn dorm room photos into rescue-ready listings. Keep usable essentials out of the dumpster and within reach for the next student." />
    <meta property="og:site_name" content="ReNest" />
    <!-- Crawlers want an absolute URL — prefix with the production domain at deploy time -->
    <meta property="og:image" content="/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReNest — Campus Move-Out Rescue" />
    <meta name="twitter:description" content="Turn dorm room photos into rescue-ready listings." />
    <meta name="twitter:image" content="/images/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ReNest" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Weight 800 is unused in the app; loading only the weights we render -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <!-- Same-origin (not inline) so it runs under script-src 'self'. Must stay
         a blocking classic script: it sets the theme class before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
