<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReNest — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #f7f1e8;
        color: #1c1a16;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      .icon { font-size: 3rem; }
      h1 { font-size: 1.5rem; font-weight: 700; }
      p { color: #6b6457; max-width: 28ch; line-height: 1.6; }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: #8a1d45;
        color: white;
        border: none;
        border-radius: 999px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon">📦</div>
    <h1>You're offline</h1>
    <p>ReNest needs a connection to load listings. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
