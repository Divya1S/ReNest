<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none">
  <!-- Maroon Ink: phone photographing a room, two gold hotspots, one price tag -->
  <!-- Phone body -->
  <rect x="150" y="80" width="420" height="560" rx="48" fill="#FFFFFF" stroke="#6a002f" stroke-width="7"/>
  <rect x="316" y="106" width="88" height="12" rx="6" fill="#6a002f" fill-opacity="0.25"/>
  <!-- Room photo inside the phone -->
  <rect x="186" y="150" width="348" height="400" rx="24" fill="#8a1d45" fill-opacity="0.07" stroke="#6a002f" stroke-width="5" stroke-opacity="0.5"/>
  <!-- room contents: bed -->
  <rect x="216" y="410" width="160" height="90" rx="14" fill="#1e304a" fill-opacity="0.10" stroke="#6a002f" stroke-width="5"/>
  <rect x="216" y="392" width="52" height="34" rx="10" fill="#FFFFFF" stroke="#6a002f" stroke-width="5"/>
  <!-- desk + lamp -->
  <rect x="404" y="330" width="106" height="10" rx="5" fill="#6a002f"/>
  <line x1="416" y1="340" x2="416" y2="416" stroke="#6a002f" stroke-width="6" stroke-linecap="round"/>
  <line x1="498" y1="340" x2="498" y2="416" stroke="#6a002f" stroke-width="6" stroke-linecap="round"/>
  <path d="M448 330 v-44 q0 -14 14 -14 h6 q16 0 16 16 v6" stroke="#6a002f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- stacked bins -->
  <rect x="228" y="238" width="96" height="52" rx="10" fill="#d9a441" fill-opacity="0.16" stroke="#6a002f" stroke-width="5"/>
  <rect x="238" y="192" width="76" height="46" rx="10" fill="#8a1d45" fill-opacity="0.10" stroke="#6a002f" stroke-width="5"/>
  <!-- Hotspot boxes (the product gesture) -->
  <rect x="212" y="380" width="172" height="128" rx="12" stroke="#d9a441" stroke-width="6" stroke-dasharray="14 10" fill="none"/>
  <circle cx="384" cy="508" r="10" fill="#d9a441" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="220" y="182" width="112" height="116" rx="12" stroke="#d9a441" stroke-width="6" stroke-dasharray="14 10" fill="none"/>
  <!-- price tag chip on the bed hotspot -->
  <rect x="300" y="352" width="118" height="46" rx="23" fill="#6a002f"/>
  <text x="359" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">$25</text>
  <!-- home indicator -->
  <rect x="308" y="600" width="104" height="10" rx="5" fill="#6a002f" fill-opacity="0.3"/>
</svg>
