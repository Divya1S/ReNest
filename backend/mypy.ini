[mypy]
plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main

# Require annotations on all public functions and methods in checked files
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True

# Relax for third-party packages without stubs
ignore_missing_imports = True
# celery / sklearn / boto3 / pywebpush ship no py.typed marker; treat as Any
follow_untyped_imports = True

[mypy.plugins.django-stubs]
django_settings_module = dormcycle.settings

# ── Per-module overrides ─────────────────────────────────────────────────────
# Infrastructure / generated files — not the focus of this annotation pass
[mypy-dormcycle.*]
ignore_errors = True

[mypy-*.migrations.*]
ignore_errors = True

# Models have complex Django metaclass typing; exclude from annotation checks
[mypy-accounts.models]
ignore_errors = True

[mypy-listings.models]
disallow_untyped_defs = False

[mypy-hubs.models]
disallow_untyped_defs = False

[mypy-concierge.models]
disallow_untyped_defs = False

[mypy-concierge.management.*]
disallow_untyped_defs = False

[mypy-concierge.tests]
disallow_untyped_defs = False

[mypy-accounts.admin]
disallow_untyped_defs = False

[mypy-listings.admin]
disallow_untyped_defs = False

# Management commands — not the annotation focus
[mypy-listings.management.*]
disallow_untyped_defs = False

# Tests — assertions catch type drift; annotations not required here
[mypy-listings.tests]
disallow_untyped_defs = False

[mypy-accounts.tests]
disallow_untyped_defs = False

[mypy-dormcycle.tests]
disallow_untyped_defs = False

[mypy-hubs.tests]
disallow_untyped_defs = False

[mypy-hubs.admin]
disallow_untyped_defs = False

[mypy-risk.tests.*]
disallow_untyped_defs = False

[mypy-risk.management.*]
disallow_untyped_defs = False
